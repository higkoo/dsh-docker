---
# ============================================================
# Ansible Playbook: DSH Docker 部署
# 读取 /dsh/config/dsh/versions.yml 版本配置
# 自动构建镜像、启动容器、验证服务
# ============================================================
# 使用方式：
#   ansible-playbook -i inventory.ini playbook.yml
# ============================================================

- name: Deploy DSH Docker Container
  hosts: dsh_servers
  become: yes
  vars:
    # 项目目录（宿主机上的路径）
    project_dir: "/workspace/dsh-docker"
    # 镜像名称
    image_name: "dsh"
    image_tag: "latest"
    # 容器名称
    container_name: "dsh-web"
    # 容器内主机名（与 entrypoint 中的 hostname 保持一致）
    container_hostname: "dsh-web"
    # 暴露端口（与 README / profile.env 保持一致：9080->80, 9443->443）
    host_http_port: 9080
    host_https_port: 9443
    # 端口映射字符串（供 uri 健康检查使用）
    health_url: "http://{{ inventory_hostname }}:{{ host_http_port }}/health"
    # 版本配置文件路径（容器内）
    versions_file: "/dsh/config/dsh/versions.yml"

    # ------------------------------------------------------------
    # 可信来访域名白名单（trusted-host）
    #
    # Nginx 不再改写 Host / Origin（那样会让插件跳第三方认证时拼错
    # 回调地址），因此必须显式声明合法的来访域名，否则除回环地址外
    # 一律 403。详见 README「可信来访域名」与 docs/DESIGN.md。
    #
    # 用法：在 inventory 里按主机设定，或在命令行覆盖，例如
    #   ansible-playbook -i inventory.ini playbook.yml \
    #     -e 'dsh_trusted_hosts=["dsh.corp.com","10.0.0.8"]'
    #
    # 留空（默认）则容器内退化为「只允许回环地址访问」，
    # 部署完记得补上，否则浏览器访问会得到 403。
    # ------------------------------------------------------------
    dsh_trusted_hosts: []

  tasks:
    # ------------------------------------------------------------
    # 1. 读取版本配置文件
    # ------------------------------------------------------------
    - name: Read versions.yml
      ansible.builtin.slurp:
        src: "{{ project_dir }}/config/dsh/versions.yml"
      register: versions_content

    - name: Parse DSH version
      ansible.builtin.set_fact:
        dsh_version: "{{ (versions_content.content | b64decode | from_yaml).dsh.version | default('latest') }}"
        dsh_url: "{{ (versions_content.content | b64decode | from_yaml).dsh.url | default('') }}"
        dsh_plugins: "{{ (versions_content.content | b64decode | from_yaml).plugins | default([]) }}"

    - name: Display parsed configuration
      ansible.builtin.debug:
        msg:
          - "DSH Version: {{ dsh_version }}"
          - "DSH URL: {{ dsh_url | default('(not set)') }}"
          - "Plugins: {{ dsh_plugins | map(attribute='name') | list }}"
          - "Trusted hosts: {{ dsh_trusted_hosts | default([]) }}"

    - name: Warn when trusted-host whitelist is empty
      ansible.builtin.debug:
        msg:
          - "警告：dsh_trusted_hosts 为空 —— 容器将只允许回环地址访问，"
          - "      浏览器访问会得到 403。请用 -e 'dsh_trusted_hosts=[...]' 指定域名或 IP。"
      when: dsh_trusted_hosts | length == 0

    # ------------------------------------------------------------
    # 2. 构建 Docker 镜像
    # ------------------------------------------------------------
    - name: Build Docker image
      community.docker.docker_image:
        build:
          path: "{{ project_dir }}"
        name: "{{ image_name }}:{{ image_tag }}"
        source: build
        force_tag: yes

    # ------------------------------------------------------------
    # 3. 停止并删除旧容器（如果存在）
    # ------------------------------------------------------------
    - name: Stop existing container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: yes

    # ------------------------------------------------------------
    # 4. 启动新容器
    # ------------------------------------------------------------
    - name: Start DSH container
      community.docker.docker_container:
        name: "{{ container_name }}"
        hostname: "{{ container_hostname }}"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ host_http_port }}:80"
          - "{{ host_https_port }}:443"
        volumes:
          - "{{ project_dir }}/workspace:/dsh/workspace"
          - "dsh-home:/dsh/home"
          - "{{ project_dir }}/config/dsh/versions.yml:/dsh/config/dsh/versions.yml:ro"
        env:
          DSH_HOME: "/dsh/home"
          # 可信来访域名白名单（逗号分隔）。为空则不注入，
          # 让容器内退化为「只允许回环地址」的 fail-closed 行为。
          DSH_TRUSTED_HOSTS: "{{ dsh_trusted_hosts | join(',') }}"
        log_driver: json-file
        log_options:
          max-size: "10m"
          max-file: "3"

    # ------------------------------------------------------------
    # 5. 等待容器健康就绪
    # ------------------------------------------------------------
    - name: Wait for DSH to be ready
      ansible.builtin.uri:
        url: "{{ health_url }}"
        method: GET
        return_content: yes
      register: health_check
      retries: 30
      delay: 2
      until: health_check.status == 200

    - name: Display health check result
      ansible.builtin.debug:
        msg: "DSH health check passed: {{ health_check.content }}"

    # ------------------------------------------------------------
    # 6. 如果配置了 URL 安装方式，触发重新安装
    # ------------------------------------------------------------
    - name: Trigger DSH reinstall if URL config changed
      ansible.builtin.command: >
        docker exec {{ container_name }} bash /dsh/script/install-dsh.sh
      when: dsh_url | length > 0
      ignore_errors: yes
