# ============================================================
# DSH 反向代理配置
# 容器内 Nginx 监听 80(HTTP) 与 443(HTTPS/SSL)，
# 所有请求转发到 DSH Web UI（默认 127.0.0.1:3080）
#
# 宿主机端口映射（docker run）：
#   外部 9080 -> 容器 80  （HTTP）
#   外部 9443 -> 容器 443（HTTPS，自签证书）
#
# 对外端口以 /dsh/profile.env 的 DSH_HTTP_PORT / DSH_HTTPS_PORT 为准，
# 本文件中的端口号仅为注释说明，实际由 docker run -p 决定。
#
# /health 提供 Nginx 状态页面
#
# ⚠ 本文件是**模板**，容器启动时由 entrypoint.sh 渲染后输出到
#   /dsh/run/nginx/conf.d/dsh-proxy.conf 再被 nginx 加载。
#   下面这几处占位符**会被替换**，改动时请注意保持占位符原样：
#     __TRUSTED_HOST_MAP__  → trusted-host 白名单的 map 条目
#     __DSH_WEB_HOST__      → DSH 监听地址（默认 127.0.0.1）
#     __DSH_WEB_PORT__      → DSH 监听端口（默认 3080）
#   直接改 /dsh/config/nginx/conf.d/dsh-proxy.conf 在容器内不生效
#   （改源文件后需重建镜像，或改环境变量让它重新渲染）。
# ============================================================

# WebSocket Upgrade 映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------
# Origin 透传处理
#
# 客户端没发 Origin 时，Nginx 侧的 $http_origin 是空串。
# 若直接 `proxy_set_header Origin $http_origin;`，会把空串也发出去，
# 变成一个「存在但为空」的 Origin 头 —— 第三方 IdP 会把它当成
# 非法值而拒绝认证，比不发送更糟。
# 这里用 map 把空串映射成真正的「不设置」：proxy_set_header 的值为 "" 时
# Nginx 会**不发送**该头（而不是发送空头）。
# ------------------------------------------------------------
map $http_origin $dsh_origin {
    default $http_origin;
    ""      "";
}

# ------------------------------------------------------------
# 可信来访域名（trusted-host 白名单）
#
# 只允许「明确列出」的域名访问，未列出的直接 403。
# 这样既能挡住用随机 Host 扫描的请求，又不必像早期那样把 Host 改写成
# 127.0.0.1 来绕过限制 —— 从而让 DSH 与它加载的插件都能看到真实的
# 来访域名与 Origin（第三方 OAuth 拼回调地址时必须用到）。
#
# default 为 1（拒绝）：忘了配白名单时只会「谁都进不来」，
# 而不会「谁都能进来」，这个方向的失败是安全的。
# ------------------------------------------------------------
map $http_host $dsh_host_denied {
    default 1;

    # 回环地址恒放行：容器内自检（curl 127.0.0.1/health）、
    # 以及 dshctl 等本机组件走 127.0.0.1/localhost 时用得到。
    # 每条都写成「精确 + 带端口正则」两条：
    #   - 精确条目匹配不带端口的 Host（如 `127.0.0.1`）
    #   - 正则条目匹配带端口的 Host（如 `127.0.0.1:3080`）
    # ⚠ 不能写成 `"127.0.0.1:*"`：nginx map 的通配只认「前缀 *」「后缀 *」
    #   和 `*.中间.*` 三种形式，`*` 前没有点分隔时会被当**字面量**，
    #   永远匹配不上任何带端口的 Host。
    "127.0.0.1"          0;
    "~^127\.0\.0\.1:"    0;
    "localhost"          0;
    "~^localhost:"       0;
    "\[::1\]"            0;
    "~^\[::1\]:"         0;

    # ↓↓↓ 白名单条目由 entrypoint.sh 在启动时注入（精确 + 带端口正则成对）
__TRUSTED_HOST_MAP__
}

# ------------------------------------------------------------
# 被拒域名的留痕开关
#
# 背景：白名单之外的域名会收到 403。403 响应本身会进 access.log，
# 但 access.log 里看的是 $request，想快速定位「是哪个 Host 被判拒的」
# 还得自己拼。所以额外把被拒请求单独记一份，行首就是 Host。
#
# ⚠ 两个 nginx 语义限制，决定了这里只能这么写：
#
#   1. `error_log` **只接受字面量级别**，不能传变量：
#        error_log /path/error.log $some_var;   → invalid log level "$some_var"
#      所以不能用「变量控制 error_log 级别」这种直觉写法（会导致 nginx 拒绝启动）。
#
#   2. `access_log ... if=<变量>` 的 if 只认 `0` / 空 为「不记录」，
#      其余值都记录。因此把「想记录」映射成字符串 "1"、"不想记录" 映射成 "0"。
#
# 于是：DSH_TRUSTED_HOST_DENY_LOG=off → 渲染成 "0" → 完全不记；
#       其余值（默认 debug）→ 渲染成 "1" → 记录。
# ------------------------------------------------------------
map $dsh_host_denied $dsh_deny_log {
    default __DSH_DENY_LOG__;
    "0"     "0";
}

# 被拒请求的日志格式：第一列直接给 Host，省得再去 $request 里扒
log_format dsh_denied 'host=$http_host status=$status '
                      'remote=$remote_addr '
                      'xff="$http_x_forwarded_for"';

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    # 被拒请求的留痕（详见上方 $dsh_deny_log 的说明）：
    #   if=$dsh_deny_log 为 "0" 时不记，其余值记录。
    access_log /dsh/log/nginx/denied.log dsh_denied if=$dsh_deny_log;

    # HTTPS (443) 证书：容器启动时自动生成的自签证书
    ssl_certificate     /dsh/config/nginx/ssl/dsh.crt;
    ssl_certificate_key /dsh/config/nginx/ssl/dsh.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ------------------------------------------------------------
    # 健康检查页面：/health 显示 Nginx stub_status
    # 不受 trusted-host 限制 —— 健康探测常以 IP 直连，
    # 若也收紧会导致探活误判。
    # ------------------------------------------------------------
    location = /health {
        stub_status on;
        access_log off;
        allow all;
    }

    # ------------------------------------------------------------
    # 所有其他请求反向代理到 DSH
    # ------------------------------------------------------------
    location / {
        # trusted-host 闸门：不在白名单里的来访域名一律 403。
        # 这是「改写 Host」被移除后新的安全边界 —— 由域名白名单把关，
        # 而不是靠把请求伪装成本地来源。
        if ($dsh_host_denied) {
            return 403 "Forbidden: host '$http_host' is not in trusted hosts.\n";
        }

        proxy_pass http://__DSH_WEB_HOST__:__DSH_WEB_PORT__;
        proxy_http_version 1.1;

        # WebSocket 支持
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ------------------------------------------------------------
        # 关键：不改写 Host / Origin，如实地透传给 DSH
        #
        # 早期版本把 Host 改写成 127.0.0.1:3080、并把 Origin 清空，
        # 目的是「让 DSH 认为请求来自本地」以绕过局域网限制。
        # 代价是 DSH 与它加载的插件都看不到真实来源：
        #   - 插件引导第三方 OAuth 时要用来访域名拼 redirect_uri，
        #     Host 被改成 127.0.0.1 后回调地址必然对不上，认证失败；
        #   - 第三方身份提供方（IdP）会校验 Origin，被清空的 Origin
        #     会让授权请求被直接拒绝。
        #
        # 现在改为「白名单 + 原样透传」：安全边界交给上面的 trusted-host
        # 闸门，DSH 侧看到的就是用户真实访问的域名。
        #
        # 用 $http_host 而不是 $host：前者**带端口**，与用户地址栏一致，
        # 第三方回调拼接时不会丢端口。
        # ------------------------------------------------------------
        proxy_set_header Host $http_host;
        proxy_set_header Origin $dsh_origin;

        # 客户端信息透传
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 明确告知后端原始 Host 与端口（部分框架只认这两个头）
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 长连接超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 请求体大小限制
        client_max_body_size 50m;
    }

}
