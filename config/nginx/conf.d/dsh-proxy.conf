# ============================================================
# DSH 反向代理配置
# 容器内 Nginx 监听 80(HTTP) 与 443(HTTPS/SSL)，
# 所有请求转发到 DSH 的 127.0.0.1:3080
#
# 宿主机端口映射（docker run）：
#   外部 8233 -> 容器 80  （HTTP）
#   外部 8443 -> 容器 443（HTTPS，自签证书）
#
# /health 提供 Nginx 状态页面
# ============================================================

# WebSocket Upgrade 映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    # HTTPS (443) 证书：容器启动时自动生成的自签证书
    ssl_certificate     /dsh/config/nginx/ssl/dsh.crt;
    ssl_certificate_key /dsh/config/nginx/ssl/dsh.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ------------------------------------------------------------
    # 健康检查页面：/health 显示 Nginx stub_status
    # ------------------------------------------------------------
    location /health {
        stub_status on;
        access_log off;
        allow all;
    }

    # ------------------------------------------------------------
    # 所有其他请求反向代理到 DSH
    # ------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;

        # WebSocket 支持
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 关键：将 Host 设为 127.0.0.1:3080
        # 让 DSH 认为请求来自本地，绕过局域网限制
        proxy_set_header Host       127.0.0.1:3080;

        # 清空 Origin 头，使跨站检查失效
        proxy_set_header Origin     "";

        # 客户端信息透传
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 请求体大小限制
        client_max_body_size 50m;
    }
}
