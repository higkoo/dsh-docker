# ============================================================
# Nginx 主配置文件
# 所有路径指向 /dsh 绿色安装目录
# ============================================================

user  www-data;
worker_processes  auto;

# PID 文件存放在 /dsh/run/
pid  /dsh/run/nginx.pid;

# 错误日志存放在 /dsh/log/nginx/
error_log  /dsh/log/nginx/error.log  warn;

events {
    worker_connections  1024;
}

http {
    # 加载 Debian Nginx 模块
    include /etc/nginx/modules-enabled/*.conf;

    # 基础配置
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------
    # 客户端真实 IP
    # ------------------------------------------------------------
    # DSH 通常在端口映射 / 网关 / LB 后面，$remote_addr 只是「最后一跳」
    # （Docker 网关、容器自身或某台代理），看不出访问者是谁，排查问题很别扭。
    # 真实 IP 由上游写在 X-Forwarded-For 里，交给 realip 模块改写 $remote_addr，
    # 这样日志与透传给 DSH 的都变成真实客户端地址。
    #
    # 这里信任所有直接来源 —— DSH 的前置代理形态不可预知，写死可信段会有一批
    # 场景取不到真实 IP。适用于内网 / 可信网络；若暴露到公网且需要防伪造，
    # 应把 set_real_ip_from 收敛为实际的代理网段。
    set_real_ip_from  0.0.0.0/0;
    set_real_ip_from  ::/0;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ------------------------------------------------------------
    # 日志格式
    # ------------------------------------------------------------
    # 第 1 列 $remote_addr 已被 realip 改写为真实客户端 IP。
    # 末尾附上 hop= 与 xff=：多层代理排查时能看清请求经过哪些跳。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" '
                      'hop=$realip_remote_addr xff="$http_x_forwarded_for"';

    # 访问日志存放在 /dsh/log/nginx/
    access_log  /dsh/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # 加载 DSH 反向代理配置
    include /dsh/config/nginx/conf.d/*.conf;
}
