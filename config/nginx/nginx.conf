# ============================================================
# Nginx 主配置文件
# 所有路径指向 /DSH 绿色安装目录
# ============================================================

user  www-data;
worker_processes  auto;

# PID 文件存放在 /DSH/run/
pid  /DSH/run/nginx.pid;

# 错误日志存放在 /DSH/logs/nginx/
error_log  /DSH/logs/nginx/error.log  warn;

events {
    worker_connections  1024;
}

http {
    # 加载 Debian Nginx 模块
    include /etc/nginx/modules-enabled/*.conf;

    # 基础配置
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 访问日志存放在 /DSH/logs/nginx/
    access_log  /DSH/logs/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # 加载 DSH 反向代理配置
    include /DSH/config/nginx/conf.d/*.conf;
}
