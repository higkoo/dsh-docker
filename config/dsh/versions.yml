# ============================================================
# DSH 及插件版本配置文件
# 此文件由 entrypoint.sh / Ansible Playbook 读取，
# 支持两种安装方式：
#   1. 组件名 + 版本号（version: latest 或具体版本号）
#   2. 直接指定下载 URL（url: https://...）
# 两种方式可混用，url 优先级高于 version。
# ============================================================

# DSH 核心包
dsh:
  # 方式一：组件名 + 版本号
  version: latest        # 使用 latest 或指定版本如 "0.1.5-rc.1"

  # 方式二：直接指定下载 URL（可选，优先于 version）
  # url: https://registry.npmjs.com/@deepseek-ai/dsh/-/dsh-0.1.5-rc.1.tgz

# DSH 插件列表
plugins:
  - name: dsh-web-lan-access
    version: latest
    # url: https://registry.npmjs.com/dsh-web-lan-access/-/dsh-web-lan-access-1.3.2.tgz
    profile: web         # 插件安装的 profile 名称

  - name: dsh-ctl
    version: latest
    # url: https://registry.npmjs.com/dsh-ctl/-/dsh-ctl-0.1.1.tgz
    profile: web
