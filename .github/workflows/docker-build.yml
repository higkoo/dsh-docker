name: Build DSH Docker Image

on:
  push:
    branches: [main, master, "feature/*"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      python_mode:
        description: "Python 安装模式：apt（默认，发行版自带 3.13）/ source（源码编译 3.14）/ none（不装）"
        type: choice
        options:
          - apt
          - source
          - none
        default: apt

permissions:
  packages: write
  contents: read

env:
  IMAGE_NAME: dsh
  # 版本号不再硬编码：推 tag 时用 tag 名，其余情况自动生成
  #   v1.2.3  -> v1.2.3
  #   分支推送 -> 空（仅 latest + sha 标签）
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  # Python 安装模式（默认 apt）
  # ------------------------------------------------------------
  #   apt    用 apt 装 Debian 发行版自带的 Python（约 3.13.5）
  #          —— 秒级安装、体积小（stdlib 约 27MB）
  #   source 源码编译指定版本（3.14.7），耗时且体积大，
  #          在 buildx 的 QEMU 环境下编译 arm64 尤其慢
  #   none   完全不装
  # DSH 本体与内置插件均为 Node.js 实现，运行时不依赖 Python，
  # 因此默认用代价最低的 apt。手动触发时可临时切换。
  PYTHON_MODE: ${{ inputs.python_mode || 'apt' }}
  # OCI 描述文案：Dockerfile 的 LABEL 与 CI 的 index 注解共用同一来源，
  # 避免两处各写一份导致不一致
  IMAGE_DESCRIPTION: "DeepSeek Harness (DSH) 的容器化绿色部署方案 —— 拉起即可使用 DSH Web 服务，内置 Nginx 反向代理、自签 HTTPS、进程看护与健康检查。"

jobs:
  # ============================================================
  # 静态检查 + 单元测试（无需 Docker，秒级完成）
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./script
          additional_files: ./test/test_versions_parser.sh

      - name: Bash syntax check
        run: |
          bash -n script/entrypoint.sh
          bash -n script/install-dsh.sh

      - name: Run versions.yml parser tests
        run: bash test/test_versions_parser.sh

      - name: Validate YAML files
        run: |
          python3 -c "
          import yaml, sys
          ok = True
          for f in ['.github/workflows/docker-build.yml',
                    'ansible/playbook.yml',
                    'config/dsh/versions.yml']:
              try:
                  yaml.safe_load(open(f))
                  print(f'OK   {f}')
              except Exception as e:
                  print(f'FAIL {f}: {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # 标签命名保持 `v` 前缀（与既有 v0.2.4 / v0.3.0 一致）：
          # type=semver 默认会剥掉 `v`，必须用 pattern 显式补回，
          # 否则会产出 `0.3.1` / `0.3` 而非 `v0.3.1` / `v0.3`。
          # 优先级决定 org.opencontainers.image.version 的取值：
          # semver 必须高于 raw=latest，否则推 tag 时 version 会被写成 "latest"。
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,priority=600
            type=sha,format=short,priority=200
          # 注意：metadata-action 会自动从仓库元数据派生
          # `manifest:org.opencontainers.image.description` 与 `...licenses`，
          # 这组 manifest: 标签优先级高于此处手动声明的 labels。
          # 若仓库 Settings 未填写 Description / License，则派生值为空，
          # 因此这里显式兜底声明，保证镜像内 label 始终有值。
          labels: |
            org.opencontainers.image.title=dsh-docker
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 多平台构建：amd64 + arm64
          platforms: linux/amd64,linux/arm64
          # 构建参数：Python 安装模式（apt / source / none，见文件头 env 说明）
          build-args: |
            PYTHON_MODE=${{ env.PYTHON_MODE }}
            # 把镜像版本烧进镜像，启动时由 entrypoint.sh 首行打印，
            # 便于现场确认「这台机器跑的是哪一版」。
            # 优先用 semver（推 tag 触发）；workflow_dispatch 等无 tag 场景回退到 sha。
            DSH_IMAGE_VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ============================================================
          # OCI 注解必须用 `annotation-index.` 前缀
          # ------------------------------------------------------------
          # buildx 产出的是 OCI image index（manifest list，含各平台
          # manifest + attestation 证明层）。GHCR package 页面读取的是
          # **index 层的 annotations**，而不是 image config 里的 label。
          # 若用 `annotation.`（写入内层 manifest），index 层仍为空，
          # 页面就会显示 "No description provided"。
          # 已实测验证：annotation. → index 注解为空；annotation-index. → 正常写入。
          # ============================================================
          outputs: "type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},annotation-index.org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }},annotation-index.org.opencontainers.image.source=https://github.com/${{ github.repository }},annotation-index.org.opencontainers.image.licenses=MIT"
          cache-from: type=gha
          cache-to: type=gha,mode=max
