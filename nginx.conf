# WebSocket Upgrade 映射：Upgrade: websocket 时走 upgrade，否则保持 close，
# 避免普通 HTTP 请求也被强加 Connection: upgrade。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP 80 -> HTTPS 443 跳转
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS 443 反向代理 DSH
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/dsh.crt;
    ssl_certificate_key /etc/nginx/ssl/dsh.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;

        # events.mux 与 events.host 是两条 WebSocket 下行链路。本监听器刻意不开
        # HTTP/2：nginx 没有 RFC 8441 的 extended CONNECT，h2 连接承载不了该
        # upgrade。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # dsh 把特权方法（settings.*、credentials.*、preset.*、host.*、
        # llm.discoverModels）钉在回环地址的 Host 上，所以正是这条重写让设置页和模型页
        # 能从局域网使用。它同时使这道 Host 校验的 DNS rebinding 检查对所有连上本端口
        # 的客户端失效。
        proxy_set_header Host       127.0.0.1:3080;

        # 这道 Host 校验会拒绝 Origin 与 Host 不一致的请求，而浏览器会为每个同源 POST
        # 和每次 WebSocket 握手带上 Origin。置空即删除该头，这使跨站检查失效。
        proxy_set_header Origin     "";

        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx 默认 60s，会掐断空闲的 WebSocket 下行链路。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
